name: EPG Sync - Einfach

on:
  workflow_dispatch:
  schedule:
    - cron: '0 */6 * * *'

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: EPG herunterladen
        run: |
          curl -L "https://iptv-org.github.io/epg/guides/de.epg.xml" -o de.xml
          echo "Download fertig: $(wc -l < de.xml) Zeilen"
          
      - name: Index erstellen
        run: |
          mkdir -p public/epg/de
          
          # Start des JSON
          echo '{"country":"de","generated":"'$(date -Iseconds)'","channels":[' > public/epg/de/index.json
          
          # Channel-IDs extrahieren und als JSON-Array speichern
          grep -o 'channel id="[^"]*"' de.xml | \
            sed 's/channel id="//;s/"//' | \
            awk '{print "{\"id\":\""$0"\"}"}' | \
            paste -sd, - >> public/epg/de/index.json
          
          # Ende des JSON
          echo ']}' >> public/epg/de/index.json
          
          # Erfolgskontrolle
          echo "=== Index-Inhalt ==="
          cat public/epg/de/index.json
          
      - name: Deploy
        uses: cloudflare/pages-action@v1
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          projectName: iptv-epg-data
          directory: public
