name: EPG Sync (JSON)

on:
  workflow_dispatch:
  schedule:
    - cron: '0 */6 * * *'

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: EPG als JSON herunterladen
        run: |
          mkdir -p public/epg/de
          
          # Lade den Channel-Index (Liste aller Sender mit EPG)
          curl -L "https://iptv-org.github.io/epg/guides/de.index.json" -o public/epg/de/index.raw.json
          
          # Konvertiere in das von Ihrer App erwartete Format
          jq '{country:"de", generated:"'$(date -Iseconds)'", channels: [.[] | {id: .id}]}' \
            public/epg/de/index.raw.json > public/epg/de/index.json
          
          echo "Erstellter Index:"
          cat public/epg/de/index.json
          
      - name: Deploy
        uses: cloudflare/pages-action@v1
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          projectName: iptv-epg-data
          directory: public
