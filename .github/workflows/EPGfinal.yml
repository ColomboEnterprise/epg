name: EPG von alternativer Quelle

on:
  workflow_dispatch:
  schedule:
    - cron: '0 */12 * * *'

jobs:
  fetch-epg:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: EPG von epgshare01 laden
        run: |
          mkdir -p public/epg/de/channels
          
          # Verwende epgshare01 (funktionierender EPG-Dienst)
          echo "📡 Lade EPG von epgshare01..."
          
          # Deutsche Sender EPG
          curl -L "https://epgshare01.online/epgshare01/epg_ripper_DE.xml.gz" -o de_epg.xml.gz
          
          # Entpacken
          gunzip -c de_epg.xml.gz > de_epg.xml
          
          echo "📄 Dateigröße: $(wc -c < de_epg.xml) Bytes"
          
          python3 << 'EOF'
          import re, json, gzip, os
          from datetime import datetime
          import xml.etree.ElementTree as ET
          
          print("📺 Verarbeite EPG-Daten...")
          
          # XML parsen (toleranter Modus)
          try:
              tree = ET.parse('de_epg.xml')
              root = tree.getroot()
          except ET.ParseError as e:
              print(f"⚠️ XML-Fehler: {e}")
              # Versuche mit Regex
              with open('de_epg.xml', 'r', encoding='utf-8', errors='ignore') as f:
                  content = f.read()
              
              # Extrahiere Programme mit Regex
              pattern = r'<programme channel="([^"]+)" start="([^"]+)" stop="([^"]+)".*?<title>([^<]+)</title>'
              programmes = re.findall(pattern, content, re.DOTALL)
              
              channels = {}
              for prog in programmes:
                  cid = prog[0]
                  if cid not in channels:
                      channels[cid] = []
                  channels[cid].append({
                      "c": cid,
                      "t": prog[3],
                      "s": prog[1],
                      "e": prog[2],
                      "d": None,
                      "cat": None
                  })
          else:
              # Normales XML Parsing
              channels = {}
              for programme in root.findall('.//programme'):
                  cid = programme.get('channel', '')
                  if not cid:
                      continue
                  
                  title_elem = programme.find('title')
                  title = title_elem.text if title_elem is not None else 'Unbekannt'
                  
                  if cid not in channels:
                      channels[cid] = []
                  
                  channels[cid].append({
                      "c": cid,
                      "t": title,
                      "s": programme.get('start', ''),
                      "e": programme.get('stop', ''),
                      "d": None,
                      "cat": None
                  })
          
          print(f"✅ Gefunden: {len(channels)} Channels")
          
          # Index erstellen
          index = {
              "country": "de",
              "generated": datetime.now().isoformat(),
              "channels": []
          }
          
          # Für jeden Channel eine Datei erstellen (max 100)
          for i, (cid, programmes) in enumerate(channels.items()):
              if i >= 100:
                  break
              
              if not programmes:
                  continue
              
              # Nach Startzeit sortieren
              programmes.sort(key=lambda x: x['s'])
              
              safe_id = re.sub(r'[^a-zA-Z0-9._-]', '_', cid)
              file_path = f'public/epg/de/channels/{safe_id}.json.gz'
              
              with gzip.open(file_path, 'wt', encoding='utf-8') as f:
                  json.dump(programmes, f, ensure_ascii=False)
              
              index['channels'].append({
                  "id": cid,
                  "file": f"channels/{safe_id}.json.gz",
                  "size": os.path.getsize(file_path),
                  "programs": len(programmes)
              })
              
              if i < 10:
                  print(f"  📡 {cid}: {len(programmes)} Programme")
          
          with open('public/epg/de/index.json', 'w') as f:
              json.dump(index, f, indent=2)
          
          print(f"\n✅ Fertig: {len(index['channels'])} Channels mit EPG-Daten")
          EOF
          
      - name: Ergebnis prüfen
        run: |
          echo "=== Index ==="
          cat public/epg/de/index.json | head -30
          echo ""
          echo "=== Channel-Dateien ==="
          ls public/epg/de/channels/ | head -10
          
      - name: Deploy
        uses: cloudflare/pages-action@v1
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          projectName: iptv-epg-data
          directory: public
