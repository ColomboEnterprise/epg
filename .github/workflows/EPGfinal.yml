name: EPG mit JSON-API

on:
  workflow_dispatch:

jobs:
  generate-epg:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: EPG-Daten von iptv-org API laden
        run: |
          mkdir -p public/epg/de/channels
          
          # 1. Lade die Liste aller Channels (JSON)
          echo "📡 Lade Channel-Liste..."
          curl -L "https://iptv-org.github.io/epg/channels.json" -o channels.json
          
          # 2. Filtere deutsche Channels
          python3 << 'EOF'
          import json, urllib.request, gzip
          from datetime import datetime
          
          # Lade alle Channels
          with open('channels.json', 'r', encoding='utf-8') as f:
              all_channels = json.load(f)
          
          # Filtere deutsche Channels (country = "DE")
          german_channels = [c for c in all_channels if c.get('country') == 'DE']
          print(f"🇩🇪 Deutsche Channels gefunden: {len(german_channels)}")
          
          # Zeige die ersten 10
          for c in german_channels[:10]:
              print(f"  - {c.get('name')} ({c.get('id')})")
          
          # 3. Für jeden Channel versuchen, EPG zu laden
          index = {
              "country": "de",
              "generated": datetime.now().isoformat(),
              "channels": []
          }
          
          for channel in german_channels[:50]:  # Erstmal nur 50 zum Testen
              cid = channel.get('id')
              if not cid:
                  continue
              
              # Versuche EPG von verschiedenen Quellen
              epg_urls = [
                  f"https://iptv-org.github.io/epg/guides/{cid}.json",
                  f"https://raw.githubusercontent.com/iptv-org/epg/master/guides/{cid}.json",
              ]
              
              for url in epg_urls:
                  try:
                      req = urllib.request.Request(url, headers={'User-Agent': 'Mozilla/5.0'})
                      with urllib.request.urlopen(req, timeout=5) as response:
                          if response.status == 200:
                              epg_data = json.loads(response.read().decode('utf-8'))
                              if epg_data:
                                  # Speichere als JSON.gz
                                  safe_id = cid.replace('/', '_').replace(':', '_')
                                  file_path = f'public/epg/de/channels/{safe_id}.json.gz'
                                  with gzip.open(file_path, 'wt', encoding='utf-8') as f:
                                      json.dump(epg_data, f, ensure_ascii=False)
                                  
                                  index['channels'].append({
                                      "id": cid,
                                      "file": f"channels/{safe_id}.json.gz",
                                      "size": 0  # Wird später gesetzt
                                  })
                                  print(f"  ✅ {cid}")
                                  break
                  except Exception as e:
                      pass
          
          # Index speichern
          with open('public/epg/de/index.json', 'w') as f:
              json.dump(index, f, indent=2)
          
          print(f"\n✅ Fertig: {len(index['channels'])} Channels mit EPG")
          EOF
          
      - name: Ergebnis prüfen
        run: |
          echo "=== Index ==="
          cat public/epg/de/index.json
          echo ""
          echo "=== Channel-Dateien ==="
          ls -la public/epg/de/channels/
