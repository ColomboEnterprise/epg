name: EPG pro Land generieren

on:
  schedule:
    - cron: '0 */6 * * *'  # Alle 6 Stunden
  workflow_dispatch:
    inputs:
      country_code:
        description: 'Ländercode'
        required: false
        default: 'de'
      days:
        description: 'Tage (1-7)'
        required: false
        default: '3'

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: EPG-Tools installieren
        run: |
          sudo apt-get update
          sudo apt-get install -y xmlstarlet jq
          
      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: iptv-org/epg Repository klonen
        run: |
          git clone https://github.com/iptv-org/epg.git
          cd epg
          npm install
          npm run build

      - name: Verfügbare Sites prüfen
        id: check_sites
        run: |
          cd epg
          echo "Verfügbare Sites für de:"
          ls sites/ | grep -E "\.de$" | head -10
          
          # Teste ob Site funktioniert
          SITES="sky.de magentatv.de zattoo.com.de waipu.tv"
          WORKING=""
          
          for site in $SITES; do
            if [ -d "sites/$site" ]; then
              echo "✅ $site verfügbar"
              WORKING="$WORKING $site"
            else
              echo "❌ $site nicht verfügbar"
            fi
          done
          echo "working_sites=$WORKING" >> $GITHUB_OUTPUT

      - name: EPG-Daten grabben
        env:
          CC: ${{ github.event.inputs.country_code || 'de' }}
          DAYS: ${{ github.event.inputs.days || '3' }}
        run: |
          mkdir -p output/epg/$CC
          
          cd epg
          SITES="${{ steps.check_sites.outputs.working_sites }}"
          
          for site in $SITES; do
            echo "📡 Grabbing $site für $DAYS Tage..."
            
            # Direkter Aufruf ohne output-Parameter - verwendet Standard-Verzeichnis
            timeout 600 node dist/cli.js grab \
              --site="$site" \
              --days="$DAYS" \
              --maxConnections=2 || echo "⚠️ Grab fehlgeschlagen für $site"
            
            # Kopiere erzeugte Dateien
            if [ -f "guide.xml" ]; then
              cp guide.xml "../output/epg/$CC/${site}.xml"
              echo "✅ $site: $(wc -l < ../output/epg/$CC/${site}.xml) Zeilen"
            fi
            
            sleep 5
          done
          cd ..

      - name: XML in Sendungen aufteilen
        if: success()
        run: |
          CC="${{ github.event.inputs.country_code || 'de' }}"
          
          for xmlfile in output/epg/$CC/*.xml; do
            if [ -f "$xmlfile" ]; then
              echo "Verarbeite $(basename $xmlfile)..."
              
              # Extrahiere Programme pro Channel mit xmlstarlet
              channels=$(xmlstarlet sel -t -v "//channel/@id" "$xmlfile" 2>/dev/null | tr '\n' ' ')
              
              for channel in $channels; do
                safe_id=$(echo "$channel" | sed 's/[^a-zA-Z0-9._-]/_/g')
                output_file="output/epg/$CC/channels/${safe_id}.xml"
                
                mkdir -p "output/epg/$CC/channels"
                
                # Extrahiere Programme für diesen Channel
                xmlstarlet sel -t \
                  -c "//channel[@id='$channel']" \
                  -c "//programme[@channel='$channel']" \
                  "$xmlfile" > "$output_file" 2>/dev/null
                
                # Komprimiere wenn nicht leer
                if [ -s "$output_file" ]; then
                  gzip -9 -f "$output_file"
                  echo "  📺 $channel: $(gzip -l ${output_file}.gz | awk 'NR==2 {print $2}') Bytes"
                fi
              done
            fi
          done

      - name: Index erstellen
        run: |
          CC="${{ github.event.inputs.country_code || 'de' }}"
          CHANNELS_DIR="output/epg/$CC/channels"
          INDEX_FILE="output/epg/$CC/index.json"
          
          if [ -d "$CHANNELS_DIR" ]; then
            echo '{"country":"'$CC'","generated":"'$(date -Iseconds)'","channels":[' > "$INDEX_FILE"
            
            first=true
            for file in $CHANNELS_DIR/*.xml.gz; do
              if [ -f "$file" ]; then
                filename=$(basename "$file")
                channel_id=$(echo "$filename" | sed 's/\.xml\.gz$//')
                size=$(stat -c%s "$file")
                
                if [ "$first" = true ]; then
                  first=false
                else
                  echo ',' >> "$INDEX_FILE"
                fi
                
                echo -n '{"id":"'$channel_id'","file":"channels/'$filename'","size":'$size'}' >> "$INDEX_FILE"
              fi
            done
            
            echo ']}' >> "$INDEX_FILE"
            echo "✅ Index erstellt: $(grep -c 'id' $INDEX_FILE) Kanäle"
          else
            echo '{"country":"'$CC'","generated":"'$(date -Iseconds)'","channels":[]}' > "$INDEX_FILE"
            echo "⚠️ Keine Channel-Dateien gefunden"
          fi

      - name: Debug - Zeige Struktur
        run: |
          echo "=== Output Struktur ==="
          find output/epg -type f -name "*.xml.gz" | head -10
          echo ""
          echo "=== Index Inhalt ==="
          cat output/epg/*/index.json 2>/dev/null | head -50

      - name: Zu Cloudflare Pages deployen
        if: success()
        uses: cloudflare/pages-action@v1
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          projectName: iptv-epg-data
          directory: output
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}
