name: EPG Sync - XML Parser

on:
  workflow_dispatch:
  schedule:
    - cron: '0 */6 * * *'

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: EPG herunterladen
        run: |
          mkdir -p public/epg/de
          curl -L "https://iptv-org.github.io/epg/guides/de.epg.xml" -o de.xml
          echo "Download: $(wc -c < de.xml) Bytes"
          echo "Erste 200 Zeichen:"
          head -c 200 de.xml
          
      - name: Channel-IDs extrahieren (Python)
        run: |
          python3 << 'EOF'
          import re, json, gzip, os
          from datetime import datetime
          
          # XML einlesen
          with open('de.xml', 'r', encoding='utf-8', errors='ignore') as f:
              content = f.read()
          
          # Alle Channel-IDs extrahieren
          channel_ids = re.findall(r'channel id="([^"]+)"', content)
          channel_ids = list(dict.fromkeys(channel_ids))  # Duplikate entfernen
          
          print(f"Gefunden: {len(channel_ids)} Channels")
          print("Beispiele:", channel_ids[:5])
          
          # Output-Verzeichnis
          os.makedirs('public/epg/de', exist_ok=True)
          
          # Index.json erstellen
          index = {
              "country": "de",
              "generated": datetime.now().isoformat(),
              "channels": [{"id": cid} for cid in channel_ids]
          }
          
          with open('public/epg/de/index.json', 'w') as f:
              json.dump(index, f, indent=2)
          
          print(f"\n✅ Index mit {len(channel_ids)} Channels erstellt")
          EOF
          
      - name: Ergebnis prüfen
        run: |
          echo "=== Index.json ==="
          cat public/epg/de/index.json | head -30
          
          echo ""
          echo "=== Dateien ==="
          ls -la public/epg/de/
          
      - name: Deploy zu Cloudflare Pages
        uses: cloudflare/pages-action@v1
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          projectName: iptv-epg-data
          directory: public
