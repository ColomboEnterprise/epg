name: EPG von iptv-org synchronisieren

on:
  schedule:
    - cron: '0 */6 * * *'  # Alle 6 Stunden
  workflow_dispatch:        # Manuell auslösbar

jobs:
  sync-epg:
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v4

      - name: EPG-Daten von iptv-org herunterladen
        run: |
          mkdir -p public/epg
          
          # Liste der Länder
          COUNTRIES="de gb us fr it es nl at ch pl"
          
          for cc in $COUNTRIES; do
            echo "📡 Lade EPG für $cc..."
            
            # Erstelle Land-Verzeichnis
            mkdir -p "public/epg/$cc"
            
            # Lade die fertige EPG-Datei (XML-Format)
            curl -L "https://iptv-org.github.io/epg/guides/${cc}.epg.xml" \
              -o "public/epg/$cc/guide.xml" -w "%{http_code}\n" \
              2>/dev/null | grep -q "200" && echo "  ✅ guide.xml geladen" || echo "  ⚠️ Keine XML-Datei"
            
            # Lade auch den Channel-Index (JSON)
            curl -L "https://iptv-org.github.io/epg/guides/${cc}.index.json" \
              -o "public/epg/$cc/index.iptv.json" -w "%{http_code}\n" \
              2>/dev/null | grep -q "200" && echo "  ✅ index.json geladen" || echo "  ⚠️ Kein Index"
          done

      - name: EPG in Channel-Dateien aufteilen
        run: |
          for cc_dir in public/epg/*/; do
            if [ -f "${cc_dir}guide.xml" ]; then
              cc=$(basename "$cc_dir")
              echo "📺 Verarbeite $cc..."
              
              mkdir -p "${cc_dir}channels"
              
              # Extrahiere alle Channel-IDs aus der XML
              grep -o 'channel id="[^"]*"' "${cc_dir}guide.xml" | \
                sed 's/channel id="//;s/"//' | sort -u | while read channel_id; do
                
                safe_id=$(echo "$channel_id" | sed 's/[^a-zA-Z0-9._-]/_/g')
                output_file="${cc_dir}channels/${safe_id}.xml"
                
                # Schreibe XML-Kopf
                echo '<?xml version="1.0" encoding="UTF-8"?>' > "$output_file"
                echo '<tv>' >> "$output_file"
                
                # Extrahiere Channel-Info
                sed -n "/<channel id=\"$channel_id\"/,/<\/channel>/p" "${cc_dir}guide.xml" >> "$output_file"
                
                # Extrahiere Programme für diesen Channel (nur heutige und morgige)
                grep -A 1000 "<programme channel=\"$channel_id\"" "${cc_dir}guide.xml" | \
                  grep -B 1000 -m 1 '</programme>' >> "$output_file" 2>/dev/null || true
                
                echo '</tv>' >> "$output_file"
                
                # Komprimiere wenn nicht leer (> 200 Bytes = nur TV-Tag)
                if [ $(stat -c%s "$output_file") -gt 200 ]; then
                  gzip -9 -f "$output_file"
                else
                  rm -f "$output_file"
                fi
              done
              
              # Erstelle Index
              echo '{"country":"'$cc'","generated":"'$(date -Iseconds)'","channels":[' > "${cc_dir}index.json"
              first=true
              for file in ${cc_dir}channels/*.xml.gz; do
                if [ -f "$file" ]; then
                  channel_id=$(basename "$file" .xml.gz)
                  size=$(stat -c%s "$file")
                  if [ "$first" = true ]; then first=false; else echo ',' >> "${cc_dir}index.json"; fi
                  echo '{"id":"'$channel_id'","file":"channels/'$(basename "$file")'","size":'$size'}' >> "${cc_dir}index.json"
                fi
              done
              echo ']}' >> "${cc_dir}index.json"
              
              channel_count=$(grep -c '"id"' "${cc_dir}index.json" || echo "0")
              echo "  ✅ $cc: $channel_count Kanäle"
            fi
          done

      - name: Globalen Index erstellen
        run: |
          echo '{"countries":[],"generated":"'$(date -Iseconds)'"}' > public/epg/index.json
          
          for cc_dir in public/epg/*/; do
            if [ -f "${cc_dir}index.json" ]; then
              cc=$(basename "$cc_dir")
              channels=$(jq '.channels | length' "${cc_dir}index.json" 2>/dev/null || echo "0")
              
              jq --arg cc "$cc" --argjson ch "$channels" \
                '.countries += [{"code":$cc,"channels":$ch}]' \
                public/epg/index.json > public/epg/index.tmp && \
                mv public/epg/index.tmp public/epg/index.json
            fi
          done
          
          echo "📊 Globaler Index erstellt:"
          cat public/epg/index.json | jq '.countries'

      - name: Debug - Struktur anzeigen
        run: |
          echo "=== EPG-Struktur ==="
          for cc in public/epg/*/; do
            cc_name=$(basename "$cc")
            channel_count=$(ls -1 ${cc}channels/*.xml.gz 2>/dev/null | wc -l || echo "0")
            echo "  $cc_name: $channel_count Kanäle"
          done
          echo ""
          echo "Gesamtgröße: $(du -sh public/epg | cut -f1)"

      - name: Zu Cloudflare Pages deployen
        uses: cloudflare/pages-action@v1
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          projectName: iptv-epg-data
          directory: public
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}
