name: EPG für mehrere Länder

on:
  workflow_dispatch:
  schedule:
    - cron: '0 */6 * * *'

jobs:
  generate-all:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        country: [de, gb, us, fr, it, es, nl, at, ch]
    steps:
      - uses: actions/checkout@v4
      
      - name: EPG für ${{ matrix.country }} generieren
        run: |
          mkdir -p public/epg/${{ matrix.country }}/channels
          
          curl -L "https://iptv-org.github.io/epg/guides/${{ matrix.country }}.epg.xml" -o ${{ matrix.country }}.xml
          
          python3 << PYTHON_SCRIPT
          import re, json, gzip, os
          from datetime import datetime
          from xml.etree import ElementTree as ET
          
          country = "${{ matrix.country }}"
          print(f"📡 Verarbeite {country}...")
          
          tree = ET.parse(f'{country}.xml')
          root = tree.getroot()
          
          programmes_by_channel = {}
          for programme in root.findall('programme'):
              cid = programme.get('channel', '')
              if not cid:
                  continue
              prog_data = {
                  'c': cid,
                  't': programme.find('title').text if programme.find('title') is not None else 'Unbekannt',
                  's': programme.get('start', ''),
                  'e': programme.get('stop', ''),
                  'd': programme.find('desc').text if programme.find('desc') is not None else None,
                  'cat': programme.find('category').text if programme.find('category') is not None else None
              }
              programmes_by_channel.setdefault(cid, []).append(prog_data)
          
          index = {"country": country, "generated": datetime.now().isoformat(), "channels": []}
          
          for cid, progs in programmes_by_channel.items():
              if not progs:
                  continue
              safe_id = re.sub(r'[^a-zA-Z0-9._-]', '_', cid)
              file_path = f'public/epg/{country}/channels/{safe_id}.json.gz'
              
              with gzip.open(file_path, 'wt', encoding='utf-8') as f:
                  json.dump(progs, f, ensure_ascii=False)
              
              index['channels'].append({
                  "id": cid,
                  "file": f"channels/{safe_id}.json.gz",
                  "size": os.path.getsize(file_path),
                  "programs": len(progs)
              })
          
          with open(f'public/epg/{country}/index.json', 'w') as f:
              json.dump(index, f, indent=2)
          
          print(f"✅ {country}: {len(index['channels'])} Channels")
          PYTHON_SCRIPT
          
      - name: Deploy
        uses: cloudflare/pages-action@v1
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          projectName: iptv-epg-data
          directory: public
