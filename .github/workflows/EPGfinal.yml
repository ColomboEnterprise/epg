name: EPG für DE testen

on:
  workflow_dispatch:

jobs:
  test-de:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: EPG für DE generieren
        run: |
          mkdir -p public/epg/de/channels
          curl -L "https://iptv-org.github.io/epg/guides/de.epg.xml" -o de.xml
          
          python3 << 'EOF'
          import re, json, gzip, os, html
          from datetime import datetime
          
          with open('de.xml', 'r', encoding='utf-8', errors='ignore') as f:
              content = html.unescape(f.read())
          
          # Suche nach Programmen
          pattern = r'<programme channel="([^"]+)" start="([^"]+)" stop="([^"]+)".*?<title>([^<]+)</title>'
          programmes = []
          
          for match in re.finditer(pattern, content, re.DOTALL):
              programmes.append({
                  "c": match.group(1),
                  "s": match.group(2),
                  "e": match.group(3),
                  "t": match.group(4).strip()
              })
          
          print(f"Gefundene Programme: {len(programmes)}")
          
          # Channels zählen
          channels = set(p["c"] for p in programmes)
          print(f"Channels: {len(channels)}")
          print("Beispiele:", list(channels)[:10])
          
          # Index erstellen
          index = {
              "country": "de",
              "generated": datetime.now().isoformat(),
              "channels": [{"id": c} for c in channels][:50]
          }
          
          os.makedirs('public/epg/de', exist_ok=True)
          with open('public/epg/de/index.json', 'w') as f:
              json.dump(index, f, indent=2)
          
          print(f"\n✅ Index mit {len(index['channels'])} Channels")
          EOF
          
      - name: Ergebnis zeigen
        run: cat public/epg/de/index.json
